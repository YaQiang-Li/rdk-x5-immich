model_parameters:
  onnx_model: onnx_fixed/clip_visual.onnx
  march: bayes-e
  working_dir: build/clip_visual
  output_model_file_prefix: model
input_parameters:
  input_name: image
  input_shape: 1x3x224x224
  input_type_rt: rgb
  input_layout_rt: NHWC
  input_type_train: rgb
  input_layout_train: NCHW
  norm_type: data_mean_and_scale
  mean_value: 122.770938 116.746013 104.093736
  scale_value: 0.01459843 0.01500777 0.01422007
calibration_parameters:
  cal_data_dir: calib/clip
  cal_data_type: float32
  calibration_type: max
  optimization: set_all_nodes_int16
compiler_parameters:
  compile_mode: latency
  optimize_level: O3
